[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-magic-navigator"
version = "0.1.0"
description = "Serve Archive Magic WARC collections through a local pywb viewer"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "archive-magic-format",
    "boto3>=1.35,<2",
    "pywb==2.9.1",
    "PyYAML>=6,<7",
    "setuptools>=68,<81",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
archive-magic-navigator = "archive_magic_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
archive_magic_navigator = [
    "templates/*.html",
    "static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: starts the real pinned pywb executable",
]
