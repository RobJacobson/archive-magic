[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-magic-fetch"
version = "0.1.0"
description = "Build annual WARC 1.1 and CDXJ collections from Internet Archive history"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "cdxj-indexer==1.4.6",
    "surt==0.3.1",
    "wayback==0.5.1",
    "warcio==1.8.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
archive-magic-fetch = "archive_magic_fetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
