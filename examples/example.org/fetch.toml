[archive]
id = "example.org"
url_pattern = "*.example.org"

[output]
type = "local" # or "remote"
data_directory = "data"

# Remote-only fields:
# bucket = "archive-magic"
# prefix = "example.org"
# endpoint_url = "https://s3.example.invalid"
# region = "auto"

[fetch]
start = "1995-01-01"
# end omitted means now
warc_target_bytes = 250000000
playback_workers = 4
playback_starts_per_second = 20.0
retries = 4
