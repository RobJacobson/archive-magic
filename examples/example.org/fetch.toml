[archive]
id = "example.org"
url_pattern = "*.example.org"
source = "wayback" # default; set "common-crawl" for WARC range acquisition
# Wayback: complete historical CDX years are cached in index/ beside this file.
# Wayback: keep this query fixed, or clear the cache when changing it.
# CC: complete per-crawl full-year queries are cached in index/common-crawl/,
# isolated by query. New catalogs add crawls; unchanged entries require manual refresh.

[output]
type = "remote"
data_directory = "data"
bucket = "example-org"
prefix = ""
endpoint_url = "https://ACCOUNT_ID.r2.cloudflarestorage.com"
region = "auto"

[fetch]
# Dates select WARC captures; uncached CDX queries cover each full calendar year.
# Wayback: the current UTC year is queried every run and never cached.
# CC: completed current-year crawl queries are cached too.
start = "2000-01-01"
